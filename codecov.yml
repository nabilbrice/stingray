codecov:
    notify: false
    # do not notify (default notification is email)

comment:
    after_n_builds: 1
    # The coverage reports of all the test jobs are now sent together, as one
    # upload, by the codecov_upload.yml workflow, so there is a single build to
    # wait for before commenting.

coverage:
  round: nearest
  # rounds the coverage percentage to the nearest value,
  # instead of always rounding down (former default behaviour)
